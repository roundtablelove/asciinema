# Run the same steps as CI (ci.yml), but against a Nix Seed instead of
# nixbuild/nix-quick-install-action + nix-community/cache-nix-action.
#
# This is ci.yml with the Install Nix / Setup Nix cache steps swapped
# for the nix-seed action -- everything after that is identical -- so
# the two workflows' wall-clock time can be compared directly across
# the same matrix. No pull_request trigger, unlike ci.yml: Seed only
# publishes on push to develop, so a PR run would have nothing to mount.
#
# paths-ignore mirrors what Seed watches: a seed-affecting push goes
# push -> Seed -> workflow_run -> here, so this never races ahead of
# the seed it needs (it did, on the very first push, before this
# chaining existed -- Seed CI ran immediately against a .seed.lock that
# didn't exist yet). A change that doesn't touch the closure still
# builds directly on push, same as ci.yml.
#
# The seed itself is produced by Seed (.github/workflows/seed.yaml).
name: Seed CI

on:
  push:
    branches: ["develop"]
    paths-ignore:
      - flake.nix
      - flake.lock
      - default.nix
      - shell.nix
      - Cargo.lock
      - Cargo.toml
      - .github/workflows/seed.yaml
  workflow_run:
    workflows:
      - Seed
    types:
      - completed

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [default, msrv]

    permissions:
      contents: read
      # OIDC for the registry, and read access to the seed package
      id-token: write
      packages: read

    steps:
      - uses: actions/checkout@v5

      # replaces Install Nix + Setup Nix cache: mounts the seed as
      # /nix/store and puts the seeded nix on PATH. no Nix installation,
      # no cache restore/save, no substituters to reach.
      - name: Mount seed
        uses: roundtablelove/nix-seed@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # TEMPORARY diagnostic: all 9 previously-checked inputs are valid.
      # the full inputDrvs list has two more: libiconv (darwin-only, from
      # default.nix's buildInputs) and this specific bash (the actual
      # builder for nix-shell-env, a different hash than the one used to
      # run this very script step). one of these two is the remaining
      # candidate.
      - name: Diagnose nix-shell-env inputs presence
        run: |
          set -x
          for p in \
            wjb6smwmv8cynnr776j01kjjzdks1863-libiconv-113 \
            55976waa157aqb1ncbwm6b8sa64b6m3h-bash-5.3p9 \
          ; do
            nix path-info "/nix/store/$p" 2>&1 || true
          done

      - name: Build
        run: nix develop .#${{ matrix.rust }} --command cargo build --verbose

      - name: Run cargo tests
        run: nix develop .#${{ matrix.rust }} --command cargo test --verbose

      - name: Run integration tests
        run: nix develop .#${{ matrix.rust }} --command tests/integration.sh

      - name: Check formatting
        run: nix develop .#${{ matrix.rust }} --command cargo fmt --check

      - name: Lint with clippy
        run: nix develop .#${{ matrix.rust }} --command cargo clippy
